        /* GOVAZAN_CORE_START */
        const GovAzanCore = (() => {
            const keys = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'], names = { Fajr: 'Subuh', Dhuhr: 'Zuhur', Asr: 'Asar', Maghrib: 'Magrib', Isha: 'Isya' };
            const offsets = { 'Asia/Jakarta': '+07:00', 'Asia/Makassar': '+08:00', 'Asia/Jayapura': '+09:00' };
            function dateAt(now, tz) { const p = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(now)); const f = k => (p.find(x => x.type === k)?.value || '01'); return f('year') + '-' + f('month') + '-' + f('day'); }
            function addDay(date, n = 1) { const d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
            function name(k, date) { return k === 'Dhuhr' && new Date(date + 'T12:00:00Z').getUTCDay() === 5 ? 'Salat Jumat' : names[k]; }
            function events(record, locationKey) { return keys.map(k => ({ key: k, name: name(k, record.date), time: record.times[k], date: record.date, at: Date.parse(record.date + 'T' + record.times[k] + ':00' + offsets[record.timezone]), id: locationKey + '|' + record.date + '|' + k })); }
            function due(events, previous, now) { return previous == null ? [] : events.filter(e => e.at > previous && e.at <= now && now - e.at <= 90000); }
            function validate(json, date, tz) { const d = json.data, p = date.split('-'), expected = p[2] + '-' + p[1] + '-' + p[0]; if (json.code !== 200 || !d || d.date?.gregorian?.date !== expected || d.meta?.timezone !== tz || Number(d.meta?.method?.id) !== 20) throw new Error('Sumber mengembalikan tanggal, zona waktu, atau metode berbeda.'); const times = {}; keys.forEach(k => { const m = String(d.timings?.[k] || '').match(/^(\d{2}):(\d{2})/); if (!m || +m[1] > 23 || +m[2] > 59) throw new Error('Jadwal dari sumber tidak valid.'); times[k] = m[1] + ':' + m[2]; }); return { success: true, date, timezone: tz, times, source: 'Aladhan — perhitungan metode Kemenag (20)', updated_at: new Date().toISOString(), cached: false }; }
            function https(url) { try { return new URL(url).protocol === 'https:'; } catch (e) { return false; } }
            return { keys, names, dateAt, addDay, name, events, due, validate, https };
        })();
        /* GOVAZAN_CORE_END */

        /* GOVAZAN_CONTROLLER_START */
        const gpLocations = { banyuasin: { name: 'Banyuasin', lat: -2.8833, lng: 104.3833, tz: 'Asia/Jakarta' }, palembang: { name: 'Palembang', lat: -2.9761, lng: 104.7754, tz: 'Asia/Jakarta' }, lahat: { name: 'Lahat', lat: -3.786, lng: 103.5428, tz: 'Asia/Jakarta' }, pagaralam: { name: 'Pagar Alam', lat: -4.0211, lng: 103.254, tz: 'Asia/Jakarta' }, jakarta: { name: 'Jakarta', lat: -6.2088, lng: 106.8456, tz: 'Asia/Jakarta' }, makassar: { name: 'Makassar', lat: -5.1477, lng: 119.4327, tz: 'Asia/Makassar' }, jayapura: { name: 'Jayapura', lat: -2.5337, lng: 140.7181, tz: 'Asia/Jayapura' } };
        const gpRemote = { standard: 'https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_02_Dhuhr_Adhan.mp3', subuh: 'https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_01_Fajr_Adhan.mp3' };
        const gp = { prefs: null, records: new Map(), requests: new Map(), activated: false, last: null, viewDate: '', today: '', pending: null, testTimer: 0, epoch: 0, audioBusy: false, serverAudio: {} };
        const gpAudio = document.getElementById('gp-native-audio') || new Audio(); gpAudio.preload = 'none';
        function gpEl(id) { return document.getElementById(id); }
        function gpMessage(text, kind = 'info') { const e = gpEl('gp-message'); e.textContent = text; e.dataset.kind = kind; }
        function gpDefaults() { return { location: 'banyuasin', coords: {}, volume: 70, recording: 'doha', standard: '', subuh: '', mutedDate: '', enabled: { Fajr: true, Dhuhr: true, Asr: true, Maghrib: true, Isha: true } }; }
        function gpStoreKey() { return 'govazan_prefs_' + (currentUser?.user_id || 'preview'); }
        function gpSavePrefs() { try { localStorage.setItem(gpStoreKey(), JSON.stringify(gp.prefs)); } catch (e) { gpMessage('Pengaturan hanya berlaku sementara; penyimpanan browser tidak tersedia.', 'error'); } }
        function gpLocation() { const base = gpLocations[gp.prefs.location] || gpLocations.banyuasin, saved = gp.prefs.coords[gp.prefs.location]; return saved && Number.isFinite(saved.lat) && Number.isFinite(saved.lng) && saved.lat >= -12 && saved.lat <= 8 && saved.lng >= 90 && saved.lng <= 142 ? { ...base, lat: saved.lat, lng: saved.lng } : base; }
        function gpLocationKey() { const l = gpLocation(); return gp.prefs.location + ':' + l.lat.toFixed(4) + ':' + l.lng.toFixed(4) + ':' + l.tz; }
        function gpRecordKey(date) { return gpLocationKey() + ':' + date; }
        function gpOnLogin() {
            gpStopAudio(); gp.activated = false; gp.last = null; gp.pending = null; gpEl('gp-manual-play')?.classList.add('d-none'); gp.serverAudio = {}; gp.epoch++;
            let saved = {}; try { saved = JSON.parse(localStorage.getItem(gpStoreKey()) || '{}'); } catch (e) { }
            gp.prefs = { ...gpDefaults(), ...saved, coords: saved.coords || {}, enabled: { ...gpDefaults().enabled, ...saved.enabled } };
            if (!gpLocations[gp.prefs.location]) gp.prefs.location = 'banyuasin'; gp.prefs.volume = Math.max(0, Math.min(100, Number(gp.prefs.volume) || 0));
            gpEl('gp-location').value = gp.prefs.location; gpEl('gp-recording').value = gp.prefs.recording; gpEl('gp-standard-url').value = gp.prefs.standard; gpEl('gp-subuh-url').value = gp.prefs.subuh; gpEl('gp-volume').value = gp.prefs.volume;
            gpRecordingChanged(); gpChangeVolume(false); gpFillCoords(); gpEl('gp-day').value = 'today'; gpSetViewDate(); gpRefreshAudioStatus(); gpLoadCurrent();
            if (IS_GAS) gasRun().withSuccessHandler(res => { gp.serverAudio = { standard: res.standard, subuh: res.subuh }; if (res.standard || res.subuh) gpEl('gp-recording').options[0].textContent = 'Rekaman konfigurasi instansi'; }).withFailureHandler(e => gpMessage('Konfigurasi instansi belum dimuat; memakai rekaman bawaan. ' + (e.message || String(e)), 'error')).getGovAzanConfig();
        }
        function gpFillCoords() { const l = gpLocation(); gpEl('gp-latitude').value = l.lat; gpEl('gp-longitude').value = l.lng; gpEl('prayer-city-label').textContent = l.name; gpEl('gp-zone-label').textContent = l.tz === 'Asia/Jakarta' ? 'WIB' : l.tz === 'Asia/Makassar' ? 'WITA' : 'WIT'; }
        function gpSetViewDate() { const today = GovAzanCore.dateAt(Date.now(), gpLocation().tz), choice = gpEl('gp-day').value; gp.viewDate = choice === 'tomorrow' ? GovAzanCore.addDay(today) : choice === 'custom' ? gpEl('gp-date').value : today; gpEl('gp-date').value = gp.viewDate; gpEl('gp-date').disabled = choice !== 'custom'; }
        function gpRefreshSchedules() { gp.records.clear(); gpLoadCurrent(); }
        function gpChangeDay() { gpSetViewDate(); gpLoadView(); }
        function gpChangeDate() { gp.viewDate = gpEl('gp-date').value; gpLoadView(); }
        function gpChangeLocation() { gpStopAudio(); gp.activated = false; gp.pending = null; gp.last = null; gp.epoch++; gpEl('gp-manual-play')?.classList.add('d-none'); gp.prefs.location = gpEl('gp-location').value; gpSavePrefs(); gpFillCoords(); gpSetViewDate(); gpRefreshAudioStatus(); gpLoadCurrent(); }
        function gpRecordingChanged() { gpEl('gp-custom-audio')?.classList.toggle('d-none', gpEl('gp-recording').value !== 'custom'); }
        function gpSaveSettings() {
            const standard = gpEl('gp-standard-url').value.trim(), subuh = gpEl('gp-subuh-url').value.trim(), mode = gpEl('gp-recording').value;
            if (mode === 'custom' && (!GovAzanCore.https(standard) || !GovAzanCore.https(subuh))) return gpMessage('Isi dua URL HTTPS langsung menuju audio standar dan Subuh.', 'error');
            const lat = Number(gpEl('gp-latitude').value), lng = Number(gpEl('gp-longitude').value); if (!gpEl('gp-latitude').value.trim() || !gpEl('gp-longitude').value.trim() || !Number.isFinite(lat) || !Number.isFinite(lng) || lat < -12 || lat > 8 || lng < 90 || lng > 142) return gpMessage('Koordinat harus berada di wilayah Indonesia.', 'error');
            gpStopAudio(); gp.activated = false; gp.last = null; gp.pending = null; gp.epoch++; gp.prefs.recording = mode; gp.prefs.standard = standard; gp.prefs.subuh = subuh; gp.prefs.coords[gp.prefs.location] = { lat, lng }; gpSavePrefs(); gpFillCoords(); gpLoadCurrent(); gpRefreshAudioStatus(); gpMessage('Pengaturan disimpan. Aktifkan ulang audio untuk menguji rekaman.', 'success');
        }
        function gpChangeVolume(save = true) { if (!gp.prefs) return; gp.prefs.volume = Number(gpEl('gp-volume').value); gpAudio.volume = gp.prefs.volume / 100; gpEl('gp-volume-value').textContent = gp.prefs.volume + '%'; if (save) gpSavePrefs(); }
        function gpMuted() { return gp.prefs?.mutedDate === GovAzanCore.dateAt(Date.now(), gpLocation().tz); }
        function toggleAzanMute() { if (!gp.prefs) return; gp.prefs.mutedDate = gpMuted() ? '' : GovAzanCore.dateAt(Date.now(), gpLocation().tz); if (gpMuted()) gpStopAudio(); gpSavePrefs(); gpRefreshAudioStatus(); }
        function gpRefreshAudioStatus() { if (!gp.prefs) return; gpEl('gp-activate').innerHTML = gp.activated ? '<i class="fas fa-check me-2"></i>Audio aktif · uji ulang' : '<i class="fas fa-volume-high me-2"></i>Aktifkan Azan Otomatis'; gpEl('gp-audio-status').textContent = gpMuted() ? 'Disenyapkan sampai pergantian hari.' : gp.activated ? 'Audio aktif untuk sesi ini. Halaman harus tetap terbuka.' : 'Audio belum diaktifkan pada sesi ini.'; gpEl('gp-mute')?.classList.toggle('gp-muted-active', gpMuted()); gpEl('gp-mute').title = gpMuted() ? 'Batalkan senyap' : 'Senyapkan hari ini'; }
        async function gpGetRecord(date) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || Math.abs(Date.parse(date + 'T00:00:00Z') - Date.now()) > 370 * 86400000) throw new Error('Pilih tanggal dalam rentang satu tahun.');
            const key = gpRecordKey(date), loc = gpLocation(); if (gp.records.has(key)) return gp.records.get(key); if (gp.requests.has(key)) return gp.requests.get(key);
            const work = (async () => {
                let record;
                try {
                    if (IS_GAS) record = await new Promise((resolve, reject) => gasRun().withSuccessHandler(resolve).withFailureHandler(reject).getGovAzanSchedule(loc.lat, loc.lng, loc.tz, date));
                    else { const p = date.split('-'), url = 'https://api.aladhan.com/v1/timings/' + p[2] + '-' + p[1] + '-' + p[0] + '?latitude=' + loc.lat + '&longitude=' + loc.lng + '&method=20&timezonestring=' + encodeURIComponent(loc.tz), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000); try { const response = await fetch(url, { signal: ctl.signal }); if (!response.ok) throw new Error('Layanan jadwal gagal (HTTP ' + response.status + ').'); record = GovAzanCore.validate(await response.json(), date, loc.tz); } finally { clearTimeout(timer); } }
                    if (record.date !== date || record.timezone !== loc.tz) throw new Error('Tanggal atau zona waktu jadwal berbeda.');
                    gp.records.set(key, record); try { localStorage.setItem('govazan_schedule_' + key, JSON.stringify(record)); } catch (e) { } return record;
                } catch (e) { try { const cached = JSON.parse(localStorage.getItem('govazan_schedule_' + key) || 'null'); if (cached?.date === date && cached.timezone === loc.tz && GovAzanCore.keys.every(k => /^\d{2}:\d{2}$/.test(cached.times?.[k]))) { cached.cached = true; gp.records.set(key, cached); return cached; } } catch (x) { } throw e; }
            })(); gp.requests.set(key, work); try { return await work; } finally { gp.requests.delete(key); }
        }
        async function gpLoadView() { const key = gpRecordKey(gp.viewDate); gpEl('gp-schedule').innerHTML = '<p class="gp-muted">Memuat jadwal...</p>'; try { await gpGetRecord(gp.viewDate); if (key === gpRecordKey(gp.viewDate)) gpRenderSchedule(); } catch (e) { if (key !== gpRecordKey(gp.viewDate)) return; gpEl('gp-schedule').innerHTML = '<p class="gp-muted">Jadwal belum tersedia.</p>'; gpEl('gp-schedule-source').textContent = 'Tidak ada jadwal cadangan untuk tanggal dan lokasi ini.'; gpMessage(e.message || 'Jadwal gagal dimuat.', 'error'); } }
        async function gpLoadCurrent() { if (!currentUser || !gp.prefs) return; const key = gpLocationKey(), today = GovAzanCore.dateAt(Date.now(), gpLocation().tz); gp.today = today; gp.last = Date.now(); gpEl('prayer-next-name').textContent = 'Memuat jadwal'; gpEl('prayer-countdown').textContent = '--:--:--'; await Promise.allSettled([gpGetRecord(today), gpGetRecord(GovAzanCore.addDay(today)), gpLoadView()]); if (key === gpLocationKey()) gpTick(); }
        function gpRenderSchedule() { const record = gp.records.get(gpRecordKey(gp.viewDate)); if (!record) return; const now = Date.now(), events = GovAzanCore.events(record, gpLocationKey()), next = (events || []).find(e => e.at > now); const container = gpEl('gp-schedule'); container.replaceChildren(); events.forEach(e => { const row = document.createElement('div'); row.className = 'gp-row' + (e.at <= now ? ' gp-past' : next?.key === e.key ? ' gp-next' : ''); const name = document.createElement('span'); name.className = 'gp-row-name'; name.textContent = e.name; const time = document.createElement('span'); time.className = 'gp-row-time'; time.textContent = e.time; const status = document.createElement('span'); status.className = 'gp-row-state'; status.textContent = gp.viewDate === gp.today ? (e.at <= now ? 'Lewat' : next?.key === e.key ? 'Berikutnya' : '') : ' '; const label = document.createElement('label'), checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = gp.prefs.enabled[e.key]; checkbox.setAttribute('aria-label', 'Aktifkan audio ' + e.name); checkbox.addEventListener('change', () => { gp.prefs.enabled[e.key] = checkbox.checked; gpSavePrefs(); }); label.append(checkbox, document.createTextNode('Audio')); row.append(name, time, status, label); container.append(row); }); gpEl('gp-schedule-source').textContent = record.source + ' · ' + (record.cached ? 'jadwal tersimpan' : 'dimuat') + ' ' + new Date(record.updated_at).toLocaleString('id-ID', { timeZone: gpLocation().tz }); }
        function gpTick() {
            if (!currentUser || !gp.prefs) { gp.last = null; return; } const now = Date.now(), today = GovAzanCore.dateAt(now, gpLocation().tz); updateDigitalClock();
            if (today !== gp.today) { gp.today = today; gpSetViewDate(); gpRefreshAudioStatus(); gpLoadCurrent(); return; }
            const events = [today, GovAzanCore.addDay(today)].flatMap(date => { const record = gp.records.get(gpRecordKey(date)); return record ? GovAzanCore.events(record, gpLocationKey()) : []; });
            const previous = gp.last; gp.last = now; const due = GovAzanCore.due(events, previous, now); due.forEach(event => gpHandleDue(event));
            const next = (events || []).find(e => e.at > now); if (next) { const s = Math.floor((next.at - now) / 1000); gpEl('prayer-next-name').textContent = next.name + (next.date !== today ? ' (besok)' : ''); gpEl('prayer-countdown').textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':'); }
            else { gpEl('prayer-next-name').textContent = 'Jadwal belum tersedia'; gpEl('prayer-countdown').textContent = '--:--:--'; }
            if (gpEl('gp-day').value === 'today' && gp.renderMinute !== Math.floor(now / 60000)) { gp.renderMinute = Math.floor(now / 60000); gpRenderSchedule(); }
        }
        async function gpClaim(id) { const claim = () => { try { const key = 'govazan_played_' + id; if (localStorage.getItem(key)) return false; localStorage.setItem(key, String(Date.now())); return true; } catch (e) { return !gp.claimed?.has(id) && (gp.claimed ??= new Set()).add(id); } }; if (navigator.locks?.request) { try { return await navigator.locks.request('govazan:' + id, claim); } catch (e) { } } return claim(); }
        async function gpHandleDue(event) { const location = gpLocationKey(); if (!await gpClaim(event.id) || !currentUser || location !== gpLocationKey()) return; gp.pending = event; Swal.fire({ icon: 'info', title: 'Waktu ' + event.name + ' telah tiba', text: 'Jadwal ' + gpLocation().name + ' · ' + event.time, toast: true, position: 'top-end', timer: 8000, showConfirmButton: false }); gpEl('gp-manual-play')?.classList.remove('d-none'); if (!gp.prefs.enabled[event.key] || gpMuted()) return gpMessage('Waktu ' + event.name + ' tiba. Audio disenyapkan atau dinonaktifkan untuk waktu ini.'); if (!gp.activated) return gpMessage('Waktu ' + event.name + ' tiba. Klik Putar azan sekarang atau aktifkan audio untuk jadwal berikutnya.'); try { if (!await gpPlay(event.key === 'Fajr' ? 'subuh' : 'standard')) return; gpMessage('Waktu ' + event.name + ' tiba. Rekaman azan sedang diputar.', 'success'); gpEl('gp-manual-play')?.classList.add('d-none'); } catch (e) { gp.activated = false; gpRefreshAudioStatus(); gpMessage('Audio otomatis belum diputar: ' + e.message + ' Klik Putar azan sekarang.', 'error'); } }
        function gpAudioURL(kind) { if (gp.prefs.recording === 'custom') return gp.prefs[kind]; return gp.serverAudio[kind] || gpRemote[kind]; }
        async function gpPlay(kind) {
            const url = gpAudioURL(kind); if (IS_GAS || gp.prefs.recording === 'custom') { if (!GovAzanCore.https(url)) throw new Error('URL rekaman harus HTTPS.'); }
            gpStopAudio(); const epoch = ++gp.epoch; if (typeof gd !== 'undefined' && (gd.listening || gd.starting)) pauseDikteRecording(true);
            if (gpAudio.getAttribute?.('src') !== url) gpAudio.src = url; gpAudio.volume = gp.prefs.volume / 100;
            gpMessage('Memuat rekaman ' + (kind === 'subuh' ? 'Subuh' : 'standar') + '… Tunggu hingga suara mulai terdengar.');
            let timer; try { await Promise.race([gpAudio.play(), new Promise((_, reject) => { timer = setTimeout(() => reject(Object.assign(new Error('Audio belum tersedia setelah 20 detik. Periksa internet atau ganti URL rekaman.'), { name: 'AudioTimeout' })), 20000); })]); if (epoch !== gp.epoch) return false; return true; }
            catch (e) { if (epoch !== gp.epoch) return false; gpAudio.pause(); throw new Error(e.name === 'NotAllowedError' ? 'Browser memblokir audio. Klik Play pada pemutar di atas, lalu coba aktivasi kembali.' : e.name === 'AudioTimeout' ? e.message : 'Rekaman gagal dimuat. Periksa koneksi dan URL audio.'); }
            finally { clearTimeout(timer); }
        }
        function gpStopAudio() { clearTimeout(gp.testTimer); gp.testTimer = 0; gp.epoch++; gpAudio.pause(); try { gpAudio.currentTime = 0; } catch (e) { } }
        async function gpActivateAudio() { if (!currentUser || gp.audioBusy) return; if (gp.prefs.volume === 0) return gpMessage('Volume masih 0%. Naikkan volume sebelum mengaktifkan audio.', 'error'); gp.audioBusy = true; gpEl('gp-activate').disabled = true; try { if (await gpPlay('standard')) { gp.activated = true; gp.prefs.mutedDate = ''; gpSavePrefs(); gpRefreshAudioStatus(); gpMessage('Uji rekaman berhasil. Audio diaktifkan untuk sesi ini; cuplikan berhenti dalam 5 detik.', 'success'); gp.testTimer = setTimeout(gpStopAudio, 5000); } } catch (e) { gp.activated = false; gpMessage(e.message, 'error'); gpRefreshAudioStatus(); } finally { gp.audioBusy = false; gpEl('gp-activate').disabled = false; } }
        async function testAzanAudio(kind = 'standard') { if (!currentUser) return; try { if (await gpPlay(kind)) { gpMessage('Memutar cuplikan rekaman ' + (kind === 'subuh' ? 'Subuh' : 'standar') + ' selama 8 detik.', 'success'); gp.testTimer = setTimeout(gpStopAudio, 8000); } } catch (e) { gpMessage(e.message, 'error'); } }
        async function gpPlayPending() { if (!gp.pending) return; try { if (!currentUser || !await gpPlay(gp.pending.key === 'Fajr' ? 'subuh' : 'standard')) return; gpEl('gp-manual-play')?.classList.add('d-none'); gpMessage('Rekaman azan diputar atas permintaan Anda.', 'success'); } catch (e) { gpMessage(e.message, 'error'); } }
        function updateDigitalClock() { const tz = gp.prefs ? gpLocation().tz : 'Asia/Jakarta', now = new Date(); gpEl('digital-clock-time').textContent = now.toLocaleTimeString('id-ID', { timeZone: tz }); gpEl('digital-clock-date').textContent = now.toLocaleDateString('id-ID', { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short' }); }
        function initPrayerWidget() { updateDigitalClock(); if (prayerCountdownInterval) clearInterval(prayerCountdownInterval); prayerCountdownInterval = setInterval(gpTick, 1000); gpAudio.addEventListener('play', () => { if (typeof gd !== 'undefined' && (gd.listening || gd.starting)) pauseDikteRecording(true); }); gpAudio.addEventListener('error', () => { if (!currentUser) return; gp.activated = false; gpRefreshAudioStatus(); gpMessage('Berkas audio tidak dapat diputar. Periksa koneksi atau gunakan URL rekaman sendiri.', 'error'); }); window.addEventListener('online', () => { gp.records.clear(); if (currentUser) gpLoadCurrent(); }); }
        function togglePrayerCompact() { const trigger = gpEl('prayer-widget-container'); bootstrap.Dropdown.getOrCreateInstance(trigger).toggle(); }
        Object.assign(window, { gpRefreshSchedules, gpChangeLocation, gpChangeDay, gpChangeDate, gpRecordingChanged, gpSaveSettings, gpChangeVolume, gpActivateAudio, gpStopAudio, gpPlayPending });
        /* GOVAZAN_CONTROLLER_END */

        function refreshDashboardData() {
            $('#stat-active-staff').text(staffList.filter(s => s.role === 'Staf' && s.status === 'Aktif').length);
            $('#stat-total-input').text(auditLogsData.length);
            $('#stat-stt-count').text(auditLogsData.filter(l => l.method === 'Speech-to-Text').length);
            $('#stat-last-cell').text(auditLogsData[0]?.cell || '—');
            renderOverviewRecent();
            gmDashboardProfiles();
        }

        function renderOverviewRecent() {
            let html = '';
            auditLogsData.slice(0, 5).forEach(item => {
                html += `
                    <tr>
                        <td><small class="text-muted"><i class="far fa-clock me-1"></i>${escapeHtml(item.timestamp)}</small></td>
                        <td class="fw-bold text-dark">${escapeHtml(item.nama_staf)}</td>
                        <td><span class="badge bg-primary font-monospace">${escapeHtml(item.cell)}</span></td>
                        <td><span class="text-dark fw-semibold">${escapeHtml(item.new_val)}</span></td>
                        <td><span class="${item.method === 'Speech-to-Text' ? 'method-badge-stt' : (item.method === 'GovLens OCR' ? 'method-badge-ocr' : 'method-badge-manual')}">${escapeHtml(item.method)}</span></td>
                    </tr>
                `;
            });
            $('#tbody-overview-recent').html(html || '<tr><td colspan="5" class="text-center text-muted">Belum ada aktivitas.</td></tr>');
        }

        function initAdminDashboard() {
            fetchUsersFromGAS();
            syncStaffData();
            refreshDashboardData();
            initAuditLogsDataTable();
            renderActivityStream();
            renderTimeTrackingCards();
            renderLivePeekGrid();
            generateReport();
        }

        function initAuditLogsDataTable() { gmSystemEnsure(); }

        function switchAdminTab(tabId, element) {
            gmBroadcastRender(); gmBroadcastSync();
            $('.admin-tab-content').addClass('d-none');
            $('#' + tabId).removeClass('d-none');
            $('.admin-sidebar .nav-link').removeClass('active');
            if (element) $(element).addClass('active');

            if (tabId === 'tab-live-peek') renderLivePeekGrid();
            else if (tabId === 'tab-activity-time') { renderActivityStream(); renderTimeTrackingCards(); }
            else if (tabId === 'tab-audit-logs') updateAuditLogsTable();
            else if (tabId === 'tab-staff-mgmt') renderStaffTable();
            else if (tabId === 'tab-reports') generateReport();
        }

        function syncStaffData() {
