        function initLuckysheetEditor(customSheetData) {
            if ($('#luckysheet-wrapper').length === 0) return;

            let staffKey = getStaffStorageKey();
            let savedLocal = null;
            try {
                let raw = localStorage.getItem(staffKey);
                if (raw) savedLocal = JSON.parse(raw);
            } catch (e) { }

            $('#luckysheet-wrapper').html('<div id="luckysheet" style="width:100%;height:100%"></div>');
            let sheetData = customSheetData || savedLocal || [
                {
                    name: 'lembar_kerja 1',
                    color: '',
                    status: '1',
                    order: '0',
                    data: [],
                    config: {}
                }
            ];

            $('#view-staff-workspace').removeClass('d-none');

            setTimeout(function () {
                try {
                    if (typeof luckysheet !== 'undefined' && typeof luckysheet.create === 'function') {
                        try { luckysheet.destroy(); } catch (err) { }

                        luckysheet.create({
                            container: 'luckysheet',
                            title: '',
                            lang: 'en',
                            showinfobar: false,
                            showsheetbar: true,
                            showtoolbar: true,
                            showstatisticBar: true,
                            enableAddRow: true,
                            enableAddBackTop: true,
                            data: sheetData,
                            hook: {
                                cellUpdateBefore: () => gmCanWriteWorkbook(),
                                cellUpdated: function (r, c, oldValue, newValue) {
                                    if (suppressCellHook) return;
                                    let colLetter = columnName(c);
                                    let cellCoord = colLetter + (r + 1);
                                    let prevValStr = oldValue ? (oldValue.v ?? oldValue.m ?? "") : "";
                                    let newValStr = newValue ? (newValue.f ?? newValue.v ?? newValue.m ?? "") : "";

                                    recordCellAuditLog(cellCoord, prevValStr, newValStr, "Manual", 0);
                                }
                            }
                        });

                        isLuckysheetLoaded = true; lastFingerprint = JSON.stringify(luckysheet.getAllSheets());
                        setTimeout(function () {
                            try { luckysheet.resize(); } catch (e) { }
                            updateLocalSyncBadge();
                        }, 200);
                        return;
                    }
                } catch (e) {
                    console.warn("Luckysheet load fail, activating fallback HTML grid.", e);
                }

                isLuckysheetLoaded = false;
                fallbackSheets = JSON.parse(JSON.stringify(sheetData)); renderFallbackHTMLGrid(); lastFingerprint = JSON.stringify(fallbackSheets);
            }, 100);
        }

        function renderFallbackHTMLGrid() {
            let container = $('#luckysheet-wrapper');
            let cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            let html = `
                <div class="p-3 bg-white h-100 overflow-auto">
                    <div class="alert alert-info py-2 px-3 small d-flex justify-content-between align-items-center mb-2">
                        <span><i class="fas fa-table me-2"></i>Editor cadangan · Luckysheet belum tersedia</span>
                        <span class="badge bg-primary">Sel Aktif: <strong id="fallback-active-cell-title">A1</strong></span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm align-middle text-center fallback-grid-table">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 50px;">#</th>
                                    ${cols.map(c => `<th>${c}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
            `;

            for (let r = 1; r <= 15; r++) {
                html += `<tr><td class="fw-bold bg-light">${r}</td>`;
                for (let c = 0; c < cols.length; c++) {
                    let cellCoord = cols[c] + r;
                    const sheet = fallbackSheets[0] || {}, cell = sheet.data?.[r - 1]?.[c] || sheet.celldata?.find(x => x.r === r - 1 && x.c === c)?.v;
                    let val = cell?.f ?? cell?.v ?? cell?.m ?? '';
                    html += `
                        <td class="p-0">
                            <input type="text" id="grid-cell-${r}-${c}" value="${escapeHtml(val)}" 
                                onfocus="window.setFallbackActiveCell(${r - 1}, ${c}, '${cellCoord}')" 
                                onchange="window.handleFallbackCellChange(${r - 1}, ${c}, '${cellCoord}', this.value)">
                        </td>
                    `;
                }
                html += `</tr>`;
            }

            html += `</tbody></table></div></div>`;
            container.html(html);
        }

        function setFallbackActiveCell(r, c, coord) {
            activeGridSelectedCell = { r: r, c: c };
            $('#fallback-active-cell-title').text(coord);
            if (!gd.target) $('#dikte-target-cell').text(coord);
        }

        function handleFallbackCellChange(r, c, coord, newVal) {
            const sheet = fallbackSheets[0] || {}, old = sheet.data?.[r]?.[c] || sheet.celldata?.find(x => x.r === r && x.c === c)?.v;
            let prevVal = old?.v ?? old?.m ?? ''; setFallbackCell(r, c, newVal);
            recordCellAuditLog(coord, prevVal, newVal, "Manual", 0);
        }

        function saveSheetToLocalStorage() {
            try {
                let staffKey = getStaffStorageKey();
                if (isLuckysheetLoaded && typeof luckysheet !== 'undefined' && luckysheet.getAllSheets) {
                    let sheetsData = luckysheet.getAllSheets();
                    localStorage.setItem(staffKey, JSON.stringify(sheetsData)); gmStaffRemember();
                } else {
                    localStorage.setItem(staffKey, JSON.stringify(fallbackSheets)); gmStaffRemember();
                }
                let nowTime = new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta' });
                localStorage.setItem(LOCAL_LAST_SAVE_KEY, nowTime);
                updateLocalSyncBadge(nowTime);
            } catch (e) { }
        }

        function getActiveCellPosition() {
            if (isLuckysheetLoaded) {
                try {
                    let lastRange = luckysheet.getRange();
                    if (lastRange && lastRange.length > 0) {
                        return { r: lastRange[0].row[0], c: lastRange[0].column[0] };
                    }
                } catch (e) { }
            }
            return activeGridSelectedCell;
        }

        let suppressCellHook = false;
        function insertTextToActiveCell(text, method = "Speech-to-Text") {
            if (!gmCanWriteWorkbook()) return Swal.fire('Lembar kerja hanya baca', 'Aktifkan kendali edit sebelum memasukkan teks.', 'warning');
            let pos = getActiveCellPosition();
            let colLetter = columnName(pos.c);
            let cellCoord = colLetter + (pos.r + 1);

            let prevValStr = "-";

            if (isLuckysheetLoaded) {
                let oldValObj = luckysheet.getCellValue(pos.r, pos.c);
                prevValStr = typeof oldValObj === "object" && oldValObj !== null ? (oldValObj.v ?? oldValObj.m ?? "") : (oldValObj ?? "");
                suppressCellHook = true;

                let inputEl = $(`#grid-cell-${pos.r + 1}-${pos.c}`);
                if (inputEl.length) {
                    setFallbackCell(pos.r, pos.c, text);
                    prevValStr = inputEl.val() || "-";
                    inputEl.val(text);
                }
            }

            $('#dikte-target-cell').text(cellCoord);
            recordCellAuditLog(cellCoord, prevValStr, text, method, 0);
        }

        /* GOVDIKTE_CORE_START */

                const m = text.match(/^(?:pindah ke sel|ke sel|pindah ke)\s+(.+)$/);
                if (m) { let to = m[1].replace(/^(ce|si)\s+/, 'c ').replace(/^be\s+/, 'b ').replace(/^de\s+/, 'd '); const words = ['nol', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh']; for (let i = 1; i < words.length; i++)to = to.replace(new RegExp('\\b' + words[i] + '$'), String(i)); const pos = address(to); return pos ? { type: 'move', pos } : { type: 'invalid' }; }
                const table = { 'baris berikutnya': 'nextRow', 'tambahkan ke isi sel': 'append', 'masukkan ke sel': 'replace', 'batalkan input terakhir': 'undo', 'batal pratinjau': 'cancel', 'jeda dikte': 'pause' };
                return table[text] ? { type: table[text] } : null;
            }

            return { coordinate, address, command, merge, signal };
        })();
        /* GOVDIKTE_CORE_END */

        /* GOVDIKTE_CONTROLLER_START */
        const gd = { target: null, owner: null, stream: null, context: null, analyser: null, source: null, frame: 0, epoch: 0, starting: false, listening: false, commandMode: false, busy: false, undo: [], startedAt: 0, duration: 0, seen: new Set(), status: 'Siap mendengarkan' };
        function gdEl(id) { return document.getElementById(id); }
        function gdMessage(text, kind = 'info') { const e = gdEl('gd-message'); e.textContent = text; e.dataset.kind = kind; }
        function gdDraft() { return gdEl('gd-preview').value; }
        function gdSetDraft(text) { gdEl('gd-preview').value = text; speechBuffer = text; updateDiktePreview(); }
        function gdState(state, text) { const p = gdEl('gov-dikte-panel'); p.dataset.state = state; gdEl('gd-state-text').textContent = text; gd.status = text; }
        function updateDiktePreview() {

        }
        function gdCurrentTarget() {
            const pos = getActiveCellPosition(); let sheet = null;
            if (isLuckysheetLoaded) sheet = luckysheet.getSheet();
            return { ...pos, sheetIndex: sheet?.index ?? null, sheetName: sheet?.name || 'lembar_kerja 1', order: Number(sheet?.order || 0), fallback: !isLuckysheetLoaded };
        }
        function gdResolveTarget(target) {
            if (!target) throw new Error('Pilih dan kunci sel tujuan terlebih dahulu.');
            if (!gmCanWriteWorkbook()) throw new Error('Kendali edit belum tersedia.');
            if (gd.owner !== currentUser?.user_id) throw new Error('Sesi pengguna berubah. Buka ulang panel dikte.');
            if (target.fallback) { if (isLuckysheetLoaded) throw new Error('Mode editor berubah. Kunci kembali sel tujuan.'); return target; }
            if (!isLuckysheetLoaded) throw new Error('Editor lembar kerja belum tersedia.');
            const sheet = (luckysheet?.getAllSheets?.() || []).find(s => target.sheetIndex != null ? String(s.index) === String(target.sheetIndex) : s.name === target.sheetName);
            if (!sheet) throw new Error('Tab tujuan sudah dihapus atau diganti. Kunci kembali sel tujuan.');
            return { ...target, order: Number(sheet.order), sheetName: sheet.name };
        }
        function gdRenderTarget() { if (!gd.target) return; gdEl('gd-target-coordinate').textContent = GovDikteCore.coordinate(gd.target.r, gd.target.c); gdEl('gd-target-sheet').textContent = gd.target.sheetName; $('#dikte-target-cell').text(GovDikteCore.coordinate(gd.target.r, gd.target.c)); }
        function captureDikteTarget() {
            if (gd.starting || gd.listening || gd.busy) return gdMessage('Jeda dikte sebelum mengganti sel tujuan.', 'error');
            if (gdDraft().trim()) return gdMessage('Masukkan atau batalkan pratinjau dahulu sebelum mengganti target.', 'error');
            try { gd.target = gdCurrentTarget(); gd.owner = currentUser?.user_id; gdRenderTarget(); gdMessage('Target terkunci. Klik sel lain tidak mengubah tujuan dikte.'); } catch (e) { gdMessage(e.message, 'error'); }
        }
        function openDiktePanel() {
            if (!gmCanWriteWorkbook()) return;
            const panel = gdEl('gov-dikte-panel'); panel.classList.remove('d-none', 'gd-mini');
            if (gd.owner !== currentUser.user_id) { gd.undo = []; gd.target = null; gdSetDraft(''); gd.owner = currentUser.user_id; }
            if (!gd.target) captureDikteTarget(); gdRestorePosition(); gdDrawIdle(); updateDiktePreview();
            gdEl('gd-record').focus();
        }
        function toggleSpeechRecognition() { if (gd.listening || gd.starting) pauseDikteRecording(); else openDiktePanel(); }
        function minimizeDiktePanel() { const panel = gdEl('gov-dikte-panel'); panel.classList.toggle('gd-mini'); gdEl('gd-minimize').setAttribute('aria-label', panel.classList.contains('gd-mini') ? 'Perluas panel' : 'Ringkas panel'); gdClampPosition(); }
        function closeDiktePanel() { pauseDikteRecording(); gdEl('gov-dikte-panel').classList.add('d-none'); gdEl('btn-stt-fab').focus(); }
        function gdButtons() {
            gdEl('gd-record').disabled = gd.starting || gd.listening || gd.busy;
            gdEl('gd-record-label').textContent = gd.starting ? 'Meminta izin...' : gd.duration ? 'Lanjutkan dikte' : 'Mulai dikte';
            gdEl('gd-pause').disabled = !gd.listening && !gd.starting; gdEl('gd-use-active').disabled = gd.starting || gd.listening || gd.busy;
            gdEl('gd-preview').readOnly = gd.starting || gd.listening;
            gdEl('gd-command-mode').disabled = gd.starting || gd.listening || gd.busy;
            updateDiktePreview();
        }
        function gdCanvas() {
            const canvas = gdEl('gd-wave-canvas'), dpr = Math.min(window.devicePixelRatio || 1, 2); const width = Math.max(100, canvas.getBoundingClientRect().width || 360), height = 76;
            if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) { canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr); }
            const ctx = canvas.getContext('2d'); if (!ctx) return null; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, width, height };
        }
        function gdDrawWave(bytes) {
            const surface = gdCanvas(); if (!surface) return; const { ctx, width, height } = surface; ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = '#263b50'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, height / 2); ctx.lineTo(width, height / 2); ctx.stroke();
            if (!bytes) return;
            const gradient = ctx.createLinearGradient(0, 0, width, 0); gradient.addColorStop(0, '#42d1bd'); gradient.addColorStop(.52, '#78b6f5'); gradient.addColorStop(1, '#a68ced');
            ctx.strokeStyle = gradient; ctx.lineWidth = 1.7; ctx.shadowBlur = 8; ctx.shadowColor = '#6fcbdb66'; ctx.beginPath();
            const step = Math.max(1, Math.floor(bytes.length / width));
            for (let i = 0; i < bytes.length; i += step) { const x = i / (bytes.length - 1) * width; const amplitude = Math.max(-1, Math.min(1, (bytes[i] - 128) / 128 * 2.8)); const y = height / 2 - amplitude * (height / 2 - 5); if (!i) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
            ctx.stroke(); ctx.shadowBlur = 0;
        }
        function gdDrawIdle() { if (!gd.listening) gdDrawWave(null); }
        function gdWaveFrame() {
            if (!gd.listening || !gd.analyser) return;
            const samples = new Uint8Array(gd.analyser.fftSize); gd.analyser.getByteTimeDomainData(samples); gdDrawWave(samples);
            const value = GovDikteCore.signal(samples); gdEl('gd-level-fill').style.width = value.percent + '%'; gdEl('gd-level-meter').setAttribute('aria-valuenow', Math.round(value.percent));
            gdEl('gd-level-text').textContent = Math.round(value.db) + ' dBFS'; gdEl('gd-wave-caption').textContent = value.peak > .96 ? 'Sinyal terlalu kuat — jauhkan mikrofon' : value.rms > .008 ? 'Sinyal mikrofon masuk' : 'Mikrofon aktif · menunggu suara';
            const seconds = Math.floor((gd.duration + Date.now() - gd.startedAt) / 1000); gdEl('gd-time').textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');

        }
        function gdReleaseAudio() {
            cancelAnimationFrame(gd.frame); gd.frame = 0;
            if (gd.stream) gd.stream.getTracks().forEach(t => t.stop()); gd.stream = null;
            try { gd.source?.disconnect(); gd.analyser?.disconnect(); } catch (e) { }
            gd.source = null; gd.analyser = null; const context = gd.context; gd.context = null; if (context) context.close().catch(() => { });
            gdEl('gd-level-fill').style.width = '0%'; gdEl('gd-level-meter').setAttribute('aria-valuenow', '0'); gdEl('gd-level-text').textContent = '— dB'; gdEl('gd-wave-caption').textContent = 'Mikrofon dimatikan'; gdDrawIdle();
        }
        async function startDikteRecording() {
            if (typeof gpAudio !== 'undefined' && !gpAudio.paused) return gdMessage('Hentikan audio azan sebelum mulai dikte.', 'error');
            if (gd.starting || gd.listening || gd.busy) return;
            if (!gd.target) captureDikteTarget();
            try { gd.target = gdResolveTarget(gd.target); gdRenderTarget(); } catch (e) { return gdMessage(e.message, 'error'); }
            if (!navigator.mediaDevices?.getUserMedia) { gdState('error', 'Mikrofon tidak tersedia'); return gdMessage('Akses mikrofon memerlukan HTTPS dan izin browser. Anda tetap dapat mengisi pratinjau manual.', 'error'); }
            const epoch = ++gd.epoch; gd.starting = true; gdState('starting', 'Menunggu izin mikrofon'); gdButtons();
            try {
                const Audio = window.AudioContext || window.webkitAudioContext; if (!Audio) throw new Error('Browser tidak mendukung visual gelombang Web Audio.');
                gd.context = new Audio(); await gd.context.resume();
                if (epoch !== gd.epoch) return;
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
                if (epoch !== gd.epoch) { stream.getTracks().forEach(t => t.stop()); return; }
                gd.stream = stream; gd.source = gd.context.createMediaStreamSource(stream); gd.analyser = gd.context.createAnalyser(); gd.analyser.fftSize = 1024; gd.source.connect(gd.analyser);
                gd.starting = false; gd.listening = true; isSpeechRecording = true; gd.startedAt = Date.now(); gd.seen = new Set();
                $('#btn-stt-fab').addClass('recording'); $('#luckysheet-wrapper').addClass('dikte-sheet-glow'); gdState('listening', 'Mendengarkan'); gdButtons(); gdWaveFrame();
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Speech) { gdState('listening', 'Uji mikrofon aktif'); gdMessage('Gelombang mengikuti suara. Transkripsi tidak tersedia di browser ini; jeda lalu isi pratinjau manual.', 'error'); return; }
                const rec = new Speech(); recognitionEngine = rec; rec.lang = 'id-ID'; rec.continuous = true; rec.interimResults = true;
                rec.onresult = event => {
                    if (epoch !== gd.epoch) return;
                    let interim = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (epoch !== gd.epoch) break;
                        const result = event.results[i];
                        if (result.isFinal) { if (!gd.seen.has(i)) { gd.seen.add(i); handleVoiceCommandAndAppend(result[0].transcript); } }
                        else interim += result[0].transcript + ' ';
                    }
                    gdEl('gd-interim').textContent = interim ? ('Mengenali: ' + interim) : '';
                };
                rec.onerror = event => { if (epoch !== gd.epoch) return; const reasons = { 'not-allowed': 'Izin dikte ditolak browser atau iframe.', 'service-not-allowed': 'Layanan pengenalan suara dibatasi browser.', 'audio-capture': 'Mikrofon tidak dapat digunakan.', 'network': 'Layanan dikte tidak terhubung.', 'no-speech': 'Belum ada ucapan yang dikenali. Coba mulai lagi.', 'language-not-supported': 'Bahasa Indonesia tidak tersedia di layanan browser ini.' }; const message = reasons[event.error] || ('Dikte berhenti: ' + event.error); pauseDikteRecording(true); gdState('error', 'Dikte belum tersedia'); gdMessage(message + ' Pratinjau tetap dapat diisi manual.', 'error'); };
                rec.onend = () => { if (epoch !== gd.epoch) return; pauseDikteRecording(false); };
                rec.start(); gdMessage(gd.commandMode ? 'Mode Perintah aktif. Ucapkan satu perintah utuh.' : 'Ucapkan teks. Klik Jeda untuk mengedit hasil sebelum dimasukkan.');
            } catch (e) {

            } finally { if (epoch === gd.epoch) { gd.starting = false; gdButtons(); } }
        }
        function pauseDikteRecording(abort = false) {
            const hadAudio = gd.listening || gd.starting;
            gd.starting = false; gd.listening = false; isSpeechRecording = false;
            if (gd.startedAt) { gd.duration += Date.now() - gd.startedAt; gd.startedAt = 0; }

            // Normal pause accepts any final result produced by stop(); abort discards late results.
            if (abort) { gd.epoch++; if (rec) { rec.onend = null; rec.onerror = null; try { rec.abort(); } catch (e) { } } }

            gdReleaseAudio(); $('#btn-stt-fab').removeClass('recording'); $('#luckysheet-wrapper').removeClass('dikte-sheet-glow');
            gdEl('gd-interim').textContent = ''; gdState('paused', gdDraft().trim() ? 'Siap diperiksa' : 'Dikte dijeda'); gdButtons();
            if (hadAudio) gdMessage('Mikrofon dimatikan. Periksa dan edit teks sebelum dimasukkan.');
        }
        function stopSpeechRecognition() { pauseDikteRecording(true); gdEl('gov-dikte-panel').classList.add('d-none'); gd.undo = []; gd.target = null; gd.owner = null; gdSetDraft(''); gd.duration = 0; gd.commandMode = false; gdEl('gd-command-mode').checked = false; gdEl('gd-command-help').classList.add('d-none'); }
        function initWebSpeechAPI() { gdInitDrag(); gdDrawIdle(); gdButtons(); }
        function openSpeechPopup() { openDiktePanel(); gdMessage('Gunakan panel ini untuk pratinjau. Popup kosong tidak digunakan sebagai pengganti izin mikrofon.'); }
        function handleDikteResultFromPopup(text) { openDiktePanel(); gdSetDraft(String(text || '')); gdMessage('Teks diterima sebagai pratinjau; belum dimasukkan ke sel.'); }

                staffList.filter(s => s.role === 'Staf').forEach(s => {
                    let msgs = mockChatStore[s.user_id] || [];

        function playNotificationChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) { }
        }

        function queueSnapshot() { if (gmStaffConflict || gmStaffPaused || gmEnding || !currentUser || currentUser.role !== 'Staf') return; clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(saveRemoteSnapshot, 2000); }
        function saveRemoteSnapshot(manual = false) {
            if (gmEnding || gmStaffConflict || (gmStaffPaused && (gmStaffLock?.state === 'active' || gmStaffAcknowledged))) return;
            if (!currentUser || currentUser.role !== 'Staf') return;

            if (snapshotBusy) { snapshotAgain = true; return; }
            const data = JSON.parse(JSON.stringify(getWorkbook())); if (!data.length) return;
            snapshotBusy = true; const owner = currentUser.user_id, saveToken = sessionToken, key = getStaffStorageKey(), logs = pendingAudits().slice(0, 500);
            $('#sync-icon-spin').addClass('fa-spin');

                } finish();
            }).withFailureHandler(err => { if (/Versi lembar kerja berubah/.test(err.message)) { gmStaffConflict = true; gmStaffOverlay(); } $('#status-sync-text').text('Belum tersimpan di server · klik Sinkronisasi'); if (manual) Swal.fire('Sinkronisasi gagal', err.message || String(err), 'error'); finish(); }).syncFullSheetToGAS({ sheets_data: data, audit_logs: logs, expected_revision: gmStaffRevision });
        }

        function importFromJson(e) {
            let file = e.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    let parsed = JSON.parse(evt.target.result);
                    let sheetsToLoad = parsed.sheets || (Array.isArray(parsed) ? parsed : null);

                    if (!sheetsToLoad || !Array.isArray(sheetsToLoad) || !sheetsToLoad.length || sheetsToLoad.length > 20 || file.size > 6000000) {
                        throw new Error("Format JSON tidak sesuai.");
                    }

                    let staffKey = getStaffStorageKey();
                    localStorage.setItem(staffKey, JSON.stringify(sheetsToLoad));
                    localStorage.setItem(staffKey + '_dirty', '1'); initLuckysheetEditor(sheetsToLoad); setTimeout(queueSnapshot, 600);

                    Swal.fire({ icon: 'success', title: 'Backup Dipulihkan!', text: 'Lembar kerja berhasil dipulihkan.' });
                } catch (err) {
                    Swal.fire('Gagal Impor', err.message, 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        window.executeImportXlsx = function() {
            const file = window.selectedXlsxFile;
            if (!file) return;

            const opt = $('input[name="importLocationOption"]:checked').val() || 'replace';
            $('#import-progress-container').removeClass('d-none');
            $('#import-progress-bar').css('width', '30%');
            $('#import-progress-percent').text('30%');
            $('#import-progress-status').text('Membaca XML, warna latar, border, dan formula sel...');
            $('#btn-do-import-xlsx').prop('disabled', true);

            // Periksa ketersediaan LuckyExcel
            if (typeof LuckyExcel !== 'undefined' && typeof LuckyExcel.transformExcelToLucky === 'function') {
                LuckyExcel.transformExcelToLucky(file, function(exportJson, luckysheetfile) {
                    if (!exportJson || !exportJson.sheets || exportJson.sheets.length === 0) {
                        $('#import-progress-container').addClass('d-none');
                        $('#btn-do-import-xlsx').prop('disabled', false);
                        fallbackImportWithSheetJS(file, opt);
                        return;
                    }

                    $('#import-progress-bar').css('width', '80%');
                    $('#import-progress-percent').text('80%');
                    $('#import-progress-status').text('Menerapkan lembar kerja identik ke tampilan...');

                    setTimeout(function() {
                        try {
                            applyImportedSheetsToLuckysheet(exportJson.sheets, opt, file.name);
                        } catch (e) {
                            console.error('Error applying imported sheets:', e);
                            $('#import-progress-container').addClass('d-none');
                            $('#btn-do-import-xlsx').prop('disabled', false);
                            Swal.fire('Gagal Menerapkan Sheet', e.message, 'error');
                        }
                    }, 80);
                }, function(err) {
                    console.warn('LuckyExcel error, beralih ke SheetJS fallback:', err);
                    fallbackImportWithSheetJS(file, opt);
                });
            } else {
                fallbackImportWithSheetJS(file, opt);
            }
        };

        function applyImportedSheetsToLuckysheet(importedSheets, opt, fileName) {
            if (!Array.isArray(importedSheets) || !importedSheets.length) throw new Error('Data sheet tidak valid.');

            // Pastikan status dan order terisi dengan benar
            importedSheets.forEach((s, idx) => {
                s.status = idx === 0 ? '1' : '0';
                s.order = String(idx);
                if (!s.name) s.name = 'Sheet ' + (idx + 1);
            });

            if (opt === 'replace') {
                // Ganti seluruh spreadsheet
                try { if (typeof luckysheet !== 'undefined' && luckysheet.destroy) luckysheet.destroy(); } catch(e) {}
                initLuckysheetEditor(importedSheets);
            } else {
                // Sisipkan sheet baru ke workbook yang sudah ada
                const currentSheets = (typeof luckysheet !== 'undefined' && luckysheet.getAllSheets) ? luckysheet.getAllSheets() : [];
                importedSheets.forEach((newS) => {
                    newS.status = '0';
                    newS.order = String(currentSheets.length);
                    currentSheets.push(newS);
                    if (typeof luckysheet !== 'undefined' && luckysheet.setSheetAdd) {
                        try { luckysheet.setSheetAdd({ name: newS.name, data: newS.data || [], celldata: newS.celldata || [] }); } catch(e) {}
                    }
                });
                try { if (typeof luckysheet !== 'undefined' && luckysheet.destroy) luckysheet.destroy(); } catch(e) {}
                initLuckysheetEditor(currentSheets);
            }

            // Simpan ke local storage
            try {
                let staffKey = getStaffStorageKey();
                localStorage.setItem(staffKey, JSON.stringify(importedSheets));
            } catch(e) {}

            $('#import-progress-bar').css('width', '100%');
            $('#import-progress-percent').text('100%');
            $('#import-progress-status').text('Selesai!');

            setTimeout(function() {
                const modalEl = document.getElementById('modalImportExcel');
                if (modalEl) bootstrap.Modal.getInstance(modalEl)?.hide();
                Swal.fire({
                    icon: 'success',
                    title: 'File Excel Berhasil Diimpor!',
                    html: `File <b>${escapeHtml(fileName || 'Excel')}</b> berhasil dimuat.<br><small class="text-muted">Warna, border, formula, dan format sel telah disesuaikan sama persis.</small>`,
                    timer: 3000,
                    showConfirmButton: false
                });
                // Otomatis picu sinkronisasi ke server jika sedang online
                if (typeof window.syncNowWithGAS === 'function') {
                    window.syncNowWithGAS(true);
                }
            }, 300);
        }

        function fallbackImportWithSheetJS(file, opt) {
            if (typeof XLSX === 'undefined') {
                $('#import-progress-container').addClass('d-none');
                $('#btn-do-import-xlsx').prop('disabled', false);
                return Swal.fire('Pustaka Excel Tidak Tersedia', 'Pastikan koneksi internet aktif untuk memuat library Excel.', 'error');
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellStyles: true, cellFormula: true, cellDates: true });
                    const newSheets = [];

                    workbook.SheetNames.forEach((sheetName, sIdx) => {
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
                        const celldata = [];
                        
                        (json || []).forEach((row, r) => {
                            (row || []).forEach((val, c) => {
                                if (val !== undefined && val !== null && val !== '') {
                                    celldata.push({ r, c, v: { v: val, m: String(val) } });
                                }
                            });
                        });

                        newSheets.push({
                            name: sheetName,
                            color: '',
                            status: sIdx === 0 ? '1' : '0',
                            order: String(sIdx),
                            data: [],
                            celldata: celldata,
                            config: {}
                        });
                    });

                    applyImportedSheetsToLuckysheet(newSheets, opt, file.name);
                } catch(err) {
                    $('#import-progress-container').addClass('d-none');
                    $('#btn-do-import-xlsx').prop('disabled', false);
                    Swal.fire('Gagal Mengimpor File', err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }
    
        function exportToXlsx() {
            if (typeof XLSX === 'undefined') return Swal.fire('Pustaka Excel belum dimuat', 'Muat ulang halaman dan periksa koneksi.', 'error');
            try {
                const wb = XLSX.utils.book_new(), names = new Set(); getWorkbook().forEach((sh, i) => {
                    let rows = (sh.data || []).map(row => (row || []).map(cell => cell?.v ?? cell?.m ?? '')); if (!rows.length) (sh.celldata || []).forEach(x => { rows[x.r] ??= []; rows[x.r][x.c] = x.v?.v ?? x.v?.m ?? ''; }); const ws = XLSX.utils.aoa_to_sheet(rows);
                    const cells = []; (sh.data || []).forEach((row, r) => (row || []).forEach((v, c) => { if (v?.f) cells.push({ r, c, v }); })); if (!sh.data?.length) cells.push(...(sh.celldata || []).filter(x => x.v?.f)); cells.forEach(x => { const address = XLSX.utils.encode_cell({ r: x.r, c: x.c }); ws[address] ??= { t: 'n', v: 0 }; ws[address].f = x.v.f.replace(/^=/, ''); });
                    let name = String(sh.name || 'Sheet' + (i + 1)).replace(/[\[\]:*?\/\\]/g, '_').slice(0, 31) || 'Sheet'; const base = name; let n = 1; while (names.has(name)) name = base.slice(0, 26) + '_' + n++; names.add(name); XLSX.utils.book_append_sheet(wb, ws, name);
                }); XLSX.writeFile(wb, 'Lembar_Kerja_' + currentUser.username + '.xlsx');
            }
            catch (err) { Swal.fire('Ekspor gagal', err.message, 'error'); }
        }
