        function gasRun(runner) {
            runner = runner || google.script.run.withFailureHandler(err => Swal.fire('Operasi gagal', err.message || String(err), 'error'));
            return new Proxy({}, {
                get: function(_, name) {
                    if (name === 'withSuccessHandler') return cb => gasRun(runner.withSuccessHandler(res => {
                        if (res && res.success === false) { Swal.fire('Operasi gagal', res.error || res.message || 'Server menolak operasi.', 'error'); return; }

                    }));
                    if (name === 'withFailureHandler' || name === 'withUserObject') return value => gasRun(runner[name](value));
                    return (...args) => runner[name](...args, sessionToken);
                }
            });
