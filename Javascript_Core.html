                val: function(v) {
                    if (v !== undefined) { elements.forEach(el => { if (el) el.value = v; }); return this; }

// Smart Error Boundary: Melindungi aplikasi dari error pihak ketiga, ekstensi & document.write
(function() {
    window.addEventListener('error', function(e) {
        const msg = (e.message || '').toLowerCase();
        // Abaikan error non-kritis dari browser, ekstensi pihak ketiga, audio, dan document.write
        if (
            msg.includes('resizeobserver') ||
            msg.includes('audiocontext') ||
            msg.includes('favicon') ||
            msg.includes('extension') ||
            msg.includes('write') || msg.includes('unexpected token') || msg.includes('syntaxerror') || msg.includes('document.write') || msg.includes('failed to execute') ||
            (msg.includes('failed to fetch') && (e.filename || '').includes('open-meteo'))
        ) {
            console.warn('[GovMonitor Non-Critical Warning Ignored]:', e.message, e.filename);
            return;
        }
        
        console.error('[GovMonitor Error Boundary]:', e.message, e.filename, e.lineno);
        const b = document.getElementById('gm-load-error');
        // Jangan tampilkan banner jika form login sudah siap di layar
        const formReady = document.getElementById('login-username') && document.getElementById('form-login');
        if (b && !window.currentUser && !formReady) {
            b.style.display = 'block';
            b.innerHTML = 'Aplikasi sedang memuat pustaka antarmuka... ' + 
                '<a href="javascript:location.reload()" style="color:#fff;text-decoration:underline;margin-left:8px;">Muat Ulang Halaman</a>';
        }
    });

    // Peringatan hanya jika jQuery benar-benar gagal setelah 15 detik
    setTimeout(function() {
        if (!window.jQuery) {
            const b = document.getElementById('gm-load-error');
            if (b && !window.currentUser && !document.getElementById('login-username')) {
                b.style.display = 'block';
                b.innerHTML = 'Pustaka antarmuka sedang memuat atau terhalang jaringan. ' +
                    '<a href="javascript:location.reload()" style="color:#fff;text-decoration:underline;margin-left:8px;">Klik di sini untuk muat ulang</a>';
            }
        }
    }, 15000);
})();
